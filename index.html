<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12131a">
  <title>TierSlot β Web</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>TierSlot β</h1>
        <p id="machineName">台を選択してください</p>
      </div>
      <button id="ruleButton" class="small-button" type="button">ルール</button>
    </header>

    <section class="status-grid" aria-label="ゲーム状況">
      <div class="status-card">
        <span id="rollsLabel">残りロール</span>
        <strong id="rollsValue">60</strong>
      </div>
      <div class="status-card">
        <span id="tierLabel">Bonus Tier</span>
        <strong id="tierValue">1</strong>
      </div>
      <div class="status-card">
        <span id="progressLabel">獲得コイン</span>
        <strong id="progressValue">0</strong>
      </div>
      <div class="status-card">
        <span id="subLabel">補助情報</span>
        <strong id="subValue">-</strong>
      </div>
      <div class="status-card accent wide">
        <span id="rewardLabel">最終報酬</span>
        <strong id="rewardValue">0</strong>
      </div>
    </section>

    <section class="machine-select" id="machineSelect">
      <button class="machine-button white-machine" data-machine="white" type="button"><strong>白台</strong><span>AT</span></button>
      <button class="machine-button blue-machine" data-machine="blue" type="button"><strong>青台</strong><span>A TYPE</span></button>
      <button class="machine-button yellow-machine" data-machine="yellow" type="button"><strong>黄台</strong><span>301</span></button>
      <button class="machine-button red-machine" data-machine="red" type="button"><strong>赤台</strong><span>501</span></button>
      <button class="machine-button brown-machine" data-machine="brown" type="button"><strong>茶台</strong><span>666</span></button>
      <button class="machine-button purple-machine" data-machine="purple" type="button"><strong>紫台</strong><span>BOSS RUSH</span></button>
      <button class="machine-button mahjong-machine full-machine" data-machine="mahjong" type="button"><strong>魔界雀</strong><span>MAHJONG × SLOT</span></button>
    </section>

    <section class="mahjong-info hidden" id="mahjongInfo">
      <div class="mahjong-line"><span>ゲーム</span><strong id="mahjongGameValue">1 / 5</strong></div>
      <div class="mahjong-line"><span>ドラ</span><div id="doraList" class="tile-list"></div></div>
      <div class="mahjong-line hand-line"><span>手牌</span><div id="handList" class="tile-list hand-list"></div></div>
      <div class="mahjong-line"><span>ゲーム得点</span><strong id="mahjongScoreValue">0</strong></div>
    </section>

    <section class="slot-panel">
      <div class="reels" aria-label="リール">
        <div id="reel0" class="reel">1</div>
        <div id="reel1" class="reel">1</div>
        <div id="reel2" class="reel">1</div>
      </div>

      <div id="tileChoicePanel" class="tile-choice-panel hidden">
        <p>取得する牌を選択</p>
        <div class="tile-choice-buttons">
          <button class="tile-choice-button" data-index="0" type="button"></button>
          <button class="tile-choice-button" data-index="1" type="button"></button>
          <button class="tile-choice-button" data-index="2" type="button"></button>
        </div>
        <div id="ponActions" class="pon-actions hidden">
          <button id="ponButton" class="pon-button" type="button">鳴く（3枚取得）</button>
          <button id="skipPonButton" class="secondary-button" type="button">鳴かない</button>
        </div>
      </div>

      <div class="message-panel">
        <strong id="resultTitle">台を選択</strong>
        <p id="resultMessage">遊びたい台を選んでください。</p>
      </div>

      <button id="rollButton" class="roll-button" type="button" disabled>ROLL</button>

      <div class="stop-buttons">
        <button class="stop-button" data-index="0" type="button" disabled>STOP 1</button>
        <button class="stop-button" data-index="1" type="button" disabled>STOP 2</button>
        <button class="stop-button" data-index="2" type="button" disabled>STOP 3</button>
      </div>

      <div class="sub-actions">
        <button id="retireButton" class="secondary-button" type="button" disabled>リタイア</button>
        <button id="restartButton" class="secondary-button" type="button" disabled>最初から</button>
      </div>
    </section>
  </main>

  <dialog id="ruleDialog">
    <article>
      <div class="dialog-header">
        <h2 id="ruleTitle">ルール</h2>
        <button id="closeRuleButton" class="small-button" type="button">閉じる</button>
      </div>
      <div id="ruleContent" class="rule-content"></div>
    </article>
  </dialog>

  <script src="game.js?v=7"></script>
</body>
</html>
